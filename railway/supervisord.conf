[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:gateway]
command=bash -c "cd /app/backend && uv run uvicorn src.gateway.app:app --host 0.0.0.0 --port 8001"
directory=/app
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DEER_FLOW_CONFIG_PATH="/app/config.yaml"

[program:langgraph]
command=bash -c "cd /app/backend && uv run langgraph dev --no-browser --allow-blocking --host 0.0.0.0 --port 2024"
directory=/app
autostart=true
autorestart=true
startsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DEER_FLOW_CONFIG_PATH="/app/config.yaml"
