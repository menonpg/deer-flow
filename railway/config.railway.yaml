# DeerFlow — Railway Deployment Config
# Default: Ollama with minimax-m2:cloud (no API key needed!)
# Ollama connects to MiniMax's cloud endpoint transparently.
#
# Required: Add an Ollama service to your Railway project.
# In Railway dashboard → New Service → search "Ollama"
# Then set OLLAMA_BASE_URL as a reference variable pointing to that service.
#
# Optional:
#   TAVILY_API_KEY  — https://tavily.com (1000 free searches/month)

# ============================================================================
# Models
# ============================================================================
models:
  # ── Azure OpenAI GPT-5 (Sweden Central) ─────────────────────────────────
  - name: azure-gpt5
    display_name: Azure GPT-5
    use: langchain_openai:AzureChatOpenAI
    model: gpt-5-chat
    azure_endpoint: $AZURE_OPENAI_ENDPOINT
    api_key: $AZURE_OPENAI_KEY
    azure_deployment: $AZURE_OPENAI_DEPLOYMENT
    api_version: $AZURE_OPENAI_API_VERSION
    max_tokens: 16384
    temperature: 0.7
    supports_thinking: true

  # ── Azure OpenAI GPT-4o (llminference01 — vision + general) ─────────────
  - name: azure-gpt4o
    display_name: Azure GPT-4o
    use: langchain_openai:AzureChatOpenAI
    model: gpt-4o
    azure_endpoint: $AZURE_ASSISTANT_ENDPOINT
    api_key: $AZURE_ASSISTANT_KEY
    azure_deployment: $AZURE_ASSISTANT_DEPLOYMENT
    api_version: $AZURE_ASSISTANT_API_VERSION
    max_tokens: 4096
    temperature: 0.7
    supports_vision: true
    supports_thinking: true

  # ── Google Gemini 2.0 Flash ──────────────────────────────────────────────
  - name: gemini-flash
    display_name: Gemini 2.0 Flash
    use: langchain_google_genai:ChatGoogleGenerativeAI
    model: gemini-2.0-flash
    api_key: $GEMINI_API_KEY
    max_tokens: 8192
    temperature: 0.7
    supports_thinking: true

  # ── Google Gemini 2.5 Pro ────────────────────────────────────────────────
  - name: gemini-25-pro
    display_name: Gemini 2.5 Pro
    use: langchain_google_genai:ChatGoogleGenerativeAI
    model: gemini-2.5-pro
    api_key: $GEMINI_API_KEY
    max_tokens: 16384
    temperature: 0.7
    supports_thinking: true

  # ── Google Gemini 3.1 Pro Preview ───────────────────────────────────────
  - name: gemini-31-pro
    display_name: Gemini 3.1 Pro
    use: langchain_google_genai:ChatGoogleGenerativeAI
    model: gemini-3.1-pro-preview
    api_key: $GEMINI_API_KEY
    max_tokens: 16384
    temperature: 0.7
    supports_thinking: true

  # ── Nano Banana 2 (Gemini 3.1 Flash Image) ──────────────────────────────
  - name: nano-banana-2
    display_name: Nano Banana 2 (Image Gen)
    use: langchain_google_genai:ChatGoogleGenerativeAI
    model: gemini-3.1-flash-image-preview
    api_key: $GEMINI_API_KEY
    max_tokens: 8192
    temperature: 0.7
    supports_thinking: true
    supports_vision: true

  # ── Gemini 2.0 Flash Image Generation ───────────────────────────────────
  - name: gemini-image
    display_name: Gemini Image Gen
    use: langchain_google_genai:ChatGoogleGenerativeAI
    model: gemini-2.0-flash-exp-image-generation
    api_key: $GEMINI_API_KEY
    max_tokens: 8192
    temperature: 0.7
    supports_vision: true

  # ── MiniMax M2 via Ollama cloud ──────────────────────────────────────────
  # Requires: ollama pull minimax-m2:cloud on the Ollama service
  - name: minimax-m2
    display_name: MiniMax M2 (Ollama)
    use: langchain_openai:ChatOpenAI
    model: minimax-m2:cloud
    api_key: ollama
    base_url: $OLLAMA_BASE_URL
    max_tokens: 4096
    temperature: 0.7

# ============================================================================
# Tools
# ============================================================================
tool_groups:
  - name: web
  - name: file:read
  - name: file:write
  - name: bash

tools:
  # Web search — Brave Search API
  - name: web_search
    group: web
    use: src.community.brave.tools:web_search_tool
    api_key: $BRAVE_API_KEY
    max_results: 5

  # Web fetch — Jina AI reader (free, no key)
  - name: web_fetch
    group: web
    use: src.community.jina_ai.tools:web_fetch_tool
    timeout: 15

  # Image search — DuckDuckGo (free)
  - name: image_search
    group: web
    use: src.community.image_search.tools:image_search_tool
    max_results: 5

  # File operations
  - name: ls
    group: file:read
    use: src.sandbox.tools:ls_tool
  - name: read_file
    group: file:read
    use: src.sandbox.tools:read_file_tool
  - name: write_file
    group: file:write
    use: src.sandbox.tools:write_file_tool
  - name: str_replace
    group: file:write
    use: src.sandbox.tools:str_replace_tool

  # Bash — runs on Railway container (no Docker-in-Docker needed)
  - name: bash
    group: bash
    use: src.sandbox.tools:bash_tool

# ============================================================================
# Sandbox — Local mode (no Docker-in-Docker on Railway)
# ============================================================================
sandbox:
  use: src.sandbox.local:LocalSandboxProvider

# ============================================================================
# Checkpointer — SQLite (persists to /data volume)
# ============================================================================
checkpointer:
  type: sqlite
  connection_string: /data/checkpoints.db

# ============================================================================
# Memory
# ============================================================================
memory:
  enabled: true
  storage_path: /data/memory.json
  debounce_seconds: 30
  max_facts: 100
  fact_confidence_threshold: 0.7
  injection_enabled: true
  max_injection_tokens: 2000

# ============================================================================
# Skills
# ============================================================================
skills:
  container_path: /mnt/skills

# ============================================================================
# Summarization
# ============================================================================
summarization:
  enabled: true
  trigger:
    - type: tokens
      value: 15564
  keep:
    type: messages
    value: 10

title:
  enabled: true
  max_words: 6
  max_chars: 60
