# DeerFlow — Railway Deployment Config
# Pre-configured for Azure OpenAI (uses existing credentials).
# Swap any model block to your preferred provider.
#
# Required env vars (set in Railway dashboard → backend service):
#   AZURE_OPENAI_API_KEY     — your Azure OpenAI key
#   AZURE_OPENAI_ENDPOINT    — e.g. https://xxx.cognitiveservices.azure.com
#   AZURE_OPENAI_API_VERSION — e.g. 2024-12-01-preview
#
# Optional:
#   TAVILY_API_KEY           — https://tavily.com (1000 free/month)
#   OLLAMA_URL               — if using Ollama service on Railway

# ============================================================================
# Models
# ============================================================================
models:
  # ── Azure OpenAI (recommended — uses existing keys) ──────────────────────
  - name: azure-gpt
    display_name: Azure OpenAI GPT
    use: langchain_openai:AzureChatOpenAI
    azure_endpoint: $AZURE_OPENAI_ENDPOINT
    api_key: $AZURE_OPENAI_API_KEY
    azure_deployment: $AZURE_OPENAI_DEPLOYMENT
    api_version: $AZURE_OPENAI_API_VERSION
    max_tokens: 4096
    temperature: 0.7
    supports_vision: false

  # ── Ollama (optional — add Ollama service to Railway project) ────────────
  # - name: ollama-llama3
  #   display_name: Llama 3.2 (Ollama / Free)
  #   use: langchain_openai:ChatOpenAI
  #   model: llama3.2
  #   api_key: ollama
  #   base_url: $OLLAMA_URL/v1
  #   max_tokens: 4096
  #   temperature: 0.7

  # ── MiniMax (free cloud — get key at minimaxi.com/en) ────────────────────
  # - name: minimax
  #   display_name: MiniMax Text-01 (Free)
  #   use: langchain_openai:ChatOpenAI
  #   model: MiniMax-Text-01
  #   api_key: $MINIMAX_API_KEY
  #   base_url: https://api.minimax.chat/v1
  #   max_tokens: 4096

# ============================================================================
# Tools
# ============================================================================
tool_groups:
  - name: web
  - name: file:read
  - name: file:write
  - name: bash

tools:
  # Web search — Tavily (1000 free/month). Set TAVILY_API_KEY in Railway.
  - name: web_search
    group: web
    use: src.community.tavily.tools:web_search_tool
    max_results: 5

  # Web fetch — Jina AI reader (free, no API key required)
  - name: web_fetch
    group: web
    use: src.community.jina_ai.tools:web_fetch_tool
    timeout: 15

  # Image search — DuckDuckGo (free)
  - name: image_search
    group: web
    use: src.community.image_search.tools:image_search_tool
    max_results: 5

  # File operations
  - name: ls
    group: file:read
    use: src.sandbox.tools:ls_tool
  - name: read_file
    group: file:read
    use: src.sandbox.tools:read_file_tool
  - name: write_file
    group: file:write
    use: src.sandbox.tools:write_file_tool
  - name: str_replace
    group: file:write
    use: src.sandbox.tools:str_replace_tool

  # Bash — runs on Railway container (no Docker-in-Docker needed)
  - name: bash
    group: bash
    use: src.sandbox.tools:bash_tool

# ============================================================================
# Sandbox — Local mode (no Docker-in-Docker on Railway)
# ============================================================================
sandbox:
  use: src.sandbox.local:LocalSandboxProvider

# ============================================================================
# Checkpointer — SQLite (persists to /data volume)
# ============================================================================
checkpointer:
  type: sqlite
  connection_string: /data/checkpoints.db

# ============================================================================
# Memory
# ============================================================================
memory:
  enabled: true
  storage_path: /data/memory.json
  debounce_seconds: 30
  max_facts: 100
  fact_confidence_threshold: 0.7
  injection_enabled: true
  max_injection_tokens: 2000

# ============================================================================
# Skills
# ============================================================================
skills:
  container_path: /mnt/skills

# ============================================================================
# Summarization
# ============================================================================
summarization:
  enabled: true
  trigger:
    - type: tokens
      value: 15564
  keep:
    type: messages
    value: 10

# ============================================================================
# Title generation
# ============================================================================
title:
  enabled: true
  max_words: 6
  max_chars: 60
